<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #C1121F; text-decoration: none; }
    a:hover { color: #8E0E17; }
  </style>
</helmet>

<div style="display: grid; grid-template-columns: 1fr 1fr; width: 1440px; height: 900px; background: #FAF6F1; font-family: 'Cormorant Garamond', Georgia, serif; color: #2B2320;">

  <div style="display: flex; flex-direction: column; justify-content: center; gap: 30px; padding: 0 96px;">

    <div style="display: flex; align-items: center; gap: 14px; font-family: 'Jost', system-ui, sans-serif; font-size: 13px; letter-spacing: 0.36em; text-transform: uppercase; color: #C1121F;">
      <span style="display: block; width: 44px; height: 1px; background: #C1121F;"></span>
      <span>19 · 09 · 2026</span>
    </div>

    <p style="margin: 0; max-width: 400px; font-size: 19px; line-height: 1.6; font-style: italic; color: rgba(43,35,32,0.72); text-wrap: pretty;">Después de varios años de compartir nuestras vidas juntos, tomamos la hermosa decisión de recibir la bendición de Dios</p>

    <div style="display: flex; flex-direction: column; line-height: 0.76; margin: -4px 0;">
      <span style="font-family: 'Great Vibes', cursive; font-size: 128px; color: #C1121F;">Ramiro</span>
      <span style="font-family: 'Great Vibes', cursive; font-size: 56px; color: #B08D57; margin-left: 26px;">&amp;</span>
      <span style="font-family: 'Great Vibes', cursive; font-size: 128px; color: #C1121F;">Juany</span>
    </div>

    <div style="font-family: 'Jost', system-ui, sans-serif; font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase;">¡Nos casamos!</div>

    <div style="display: flex; gap: 46px; padding-top: 6px; border-top: 1px solid rgba(43,35,32,0.14); margin-top: 4px;">
      <div style="display: flex; flex-direction: column; gap: 3px; padding-top: 20px;">
        <span style="font-family: 'Jost', system-ui, sans-serif; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(43,35,32,0.5);">Ceremonia</span>
        <span style="font-size: 19px;">Iglesia Santa Teresita · 21:00</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; padding-top: 20px;">
        <span style="font-family: 'Jost', system-ui, sans-serif; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(43,35,32,0.5);">Fiesta</span>
        <span style="font-size: 19px;">Salón Ucraniano</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 18px; margin-top: 8px;">
      <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; padding: 0 34px; background: #C1121F; color: #FFFDFB; font-family: 'Jost', system-ui, sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"></path><circle cx="12" cy="13.5" r="3.5"></circle></svg>
        Subí tus fotos
      </a>
      <a href="#" style="display: flex; align-items: center; height: 56px; font-family: 'Jost', system-ui, sans-serif; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #2B2320; border-bottom: 1px solid rgba(43,35,32,0.3);">Ver la galería</a>
    </div>
  </div>

  <div style="position: relative; overflow: hidden;">
    <img src="hero.jpg" alt="Los novios alejandose en un descapotable rojo" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%;">
    <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(250,246,241,0.5) 0%, rgba(250,246,241,0) 22%);"></div>
  </div>
</div>
</x-dc>
</body>
</html>
