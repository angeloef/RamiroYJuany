<!doctype html>
<html lang="es-AR" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ramiro &amp; Juany · 19.09.2026</title>
    <meta
      name="description"
      content="Nos casamos el 19 de septiembre de 2026. Subí tus fotos de la fiesta." />
    <meta name="theme-color" content="#2b2320" />
    <!-- el hero tiene que pintar en el primer frame: sin esto se ve un flash blanco
         mientras el JS carga la CSS y la foto -->
    <style>
      html,
      body {
        margin: 0;
        background: #2b2320;
      }
      @media (min-width: 900px) {
        html,
        body {
          background: #faf6f1;
        }
      }
    </style>
    <link rel="stylesheet" href="./src/css/hero.css" />
    <link rel="preload" as="image" href="./src/assets/hero.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" />
    <script>
      document.documentElement.className = 'js'
    </script>
  </head>

  <body class="demo-1">
    <main>
      <div class="content">
        <canvas class="webgl"></canvas>
      </div>

      <section class="hero" aria-labelledby="hero-nombres">
        <div class="hero__media" data-media>
          <img src="./src/assets/hero.jpg" fetchpriority="high" decoding="async" alt="Ramiro y Juany alejándose en un descapotable rojo por un camino de ripio" />
        </div>
        <div class="hero__scrim"></div>

        <div class="hero__content">
          <div class="hero__top">
            <div class="hero__fecha caps" data-reveal>
              <span class="hero__rule"></span>
              <span>19 · 09 · 2026</span>
              <span class="hero__rule"></span>
            </div>

            <h1 id="hero-nombres" class="hero__nombres" data-reveal>
              <span>Ramiro</span>
              <span class="hero__amp">&amp;</span>
              <span>Juany</span>
            </h1>

            <div class="hero__casamos caps" data-reveal>¡Nos casamos!</div>

            <p class="hero__intro" data-reveal>
              Después de varios años de compartir nuestras vidas juntos, tomamos la hermosa decisión
              de recibir la bendición de Dios
            </p>
          </div>

          <div class="hero__bottom">
            <div class="hero__datos" data-reveal>
              <span>Iglesia Santa Teresita · 21:00</span>
              <span>Cena · Salón Ucraniano</span>
            </div>

            <div class="hero__acciones" data-reveal>
              <a href="#" class="hero__primario caps">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M4 8h3l1.5-2h7L17 8h3v11H4z" />
                  <circle cx="12" cy="13.5" r="3.5" />
                </svg>
                Subí tus fotos
              </a>
              <button type="button" class="hero__secundario caps" data-ver-galeria>
                Ver la galería
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
