services:
  # el prototipo (hero + galeria) como sitio estatico
  - type: web
    name: ramiro-y-juany
    runtime: static
    rootDir: prototipo
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # la app Next: portada + subida por QR. Free por ahora: duerme a los 15 min
  # de inactividad y el primer request tarda ~30 s. Antes de la fiesta, plan pago.
  - type: web
    name: boda-app
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run db:migrate && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boda-db
          property: connectionString
      # R2: se cargan a mano en el dashboard (Environment)
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

databases:
  # free: 1 GB y caduca a los 30 dias. Solo alcanza para metadata, y hay que
  # recrearla antes del evento con un plan pago.
  - name: boda-db
    plan: free
    databaseName: boda
    user: boda
