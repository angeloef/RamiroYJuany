services:
  # un solo servicio: sirve el sitio (hero + galeria 3D, build de Vite en public/sitio),
  # la subida por QR y la API. Free por ahora: duerme a los 15 min
  # de inactividad y el primer request tarda ~30 s. Antes de la fiesta, plan pago.
  - type: web
    name: ramiro-y-juany
    runtime: node
    plan: free
    autoDeploy: true
    # las migraciones se corren a mano (npm run db:migrate) contra la base;
    # meterlas en el build solo suma formas de que falle el deploy
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      # base free ya existente en la cuenta (Render permite una sola):
      # se pega la Internal Database URL a mano en el dashboard
      - key: DATABASE_URL
        sync: false
      # R2: se cargan a mano en el dashboard (Environment)
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

